name: pet_overlay
description: Pet Overlay — 住在手機螢幕上的貓（懸浮視窗，MVP）
publish_to: 'none'
version: 0.4.0+4

environment:
  sdk: ^3.4.0

dependencies:
  flutter:
    sdk: flutter
  # 以 Flutter 3.50.0（stable）在 CI 解析出的版本為準
  camera: ^0.12.2
  record: ^7.2.0
  shared_preferences: ^2.5.6
  # 內建修改版（MIT，原作 X-SLAYER，1.0.2）；改了什麼見 packages/flutter_overlay_window/PET_LIFE_CHANGES.md
  flutter_overlay_window:
    path: packages/flutter_overlay_window
  # 3D 可行性實驗：Flutter GPU 上的 3D 引擎（需 Flutter 3.47+ stable，並在 AndroidManifest 開啟 Flutter GPU）
  flutter_scene: ^0.24.3
  vector_math: ^2.1.4

dev_dependencies:
  flutter_test:
    sdk: flutter

flutter:
  uses-material-design: true
  assets:
    # Khronos glTF Sample Assets 的 Fox（授權見 assets/models/Fox.LICENSE.md）
    - assets/models/Fox.glb
