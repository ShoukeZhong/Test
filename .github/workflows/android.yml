name: android-apk
on:
  push:
    branches: [main, pet-life]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    defaults:
      run:
        shell: bash
    steps:
      - uses: actions/checkout@v4
      - run: mkdir -p ci-out
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'
      - uses: subosito/flutter-action@v2
        with:
          channel: stable
          cache: true
      - run: flutter --version 2>&1 | tee ci-out/flutter_version.txt

      # 你的筆電不用裝 Flutter：android/ 資料夾在雲端自動產生
      - name: Generate android/ folder
        run: |
          flutter create . --platforms=android --project-name pet_overlay --org com.joker 2>&1 | tee ci-out/create.log
          rm -f test/widget_test.dart

      - name: Patch AndroidManifest and minSdk
        run: |
          python3 - <<'PY'
          import re, pathlib
          p = pathlib.Path("android/app/src/main/AndroidManifest.xml")
          s = p.read_text(encoding="utf-8")
          perms = ['CAMERA', 'RECORD_AUDIO', 'VIBRATE', 'SYSTEM_ALERT_WINDOW', 'POST_NOTIFICATIONS',
                   'FOREGROUND_SERVICE', 'FOREGROUND_SERVICE_SPECIAL_USE',
                   'FOREGROUND_SERVICE_MICROPHONE', 'FOREGROUND_SERVICE_CAMERA']
          add = ''.join(f'<uses-permission android:name="android.permission.{x}"/>\n    ' for x in perms
                        if f'android.permission.{x}"' not in s)
          s = s.replace("<application", add + "<application", 1)
          # 懸浮視窗的前景服務：specialUse 一定有；麥克風／相機要在 manifest 宣告，實際用哪些由
          # packages/flutter_overlay_window 的 startForegroundWithTypes() 依已授權的權限決定
          if "OverlayService" not in s:
              service = (
                  '    <service android:name="flutter.overlay.window.flutter_overlay_window.OverlayService"\n'
                  '            android:exported="false"\n'
                  '            android:foregroundServiceType="specialUse|microphone|camera">\n'
                  '            <property android:name="android.app.PROPERTY_SPECIAL_USE_FGS_SUBTYPE"\n'
                  '                android:value="Animated pet companion shown over other apps"/>\n'
                  '        </service>\n'
                  '    '
              )
              s = s.replace("</application>", service + "</application>", 1)
          s = s.replace('android:label="pet_overlay"', 'android:label="Pet Overlay"')
          p.write_text(s, encoding="utf-8")
          pathlib.Path("ci-out/AndroidManifest.xml").write_text(s, encoding="utf-8")
          for g in ["android/app/build.gradle.kts", "android/app/build.gradle"]:
              gp = pathlib.Path(g)
              if gp.exists():
                  t = gp.read_text(encoding="utf-8")
                  t = re.sub(r"minSdk(Version)?\s*=?\s*flutter\.minSdkVersion", lambda m: "minSdk = 24" if g.endswith(".kts") else "minSdkVersion 24", t)
                  gp.write_text(t, encoding="utf-8")
                  pathlib.Path("ci-out/" + gp.name).write_text(t, encoding="utf-8")
          PY

      - run: flutter pub get 2>&1 | tee ci-out/pub_get.log
      - run: flutter pub deps --style=compact > ci-out/deps.txt 2>&1 || true

      - name: Analyze
        id: analyze
        continue-on-error: true
        run: flutter analyze --no-fatal-infos --no-fatal-warnings 2>&1 | tee ci-out/analyze.log; exit ${PIPESTATUS[0]}

      - name: Unit tests
        id: unit
        continue-on-error: true
        run: flutter test --reporter expanded 2>&1 | tee ci-out/test.log; exit ${PIPESTATUS[0]}

      - name: Build APK
        id: build
        run: |
          # Gradle 偶爾下載依賴失敗：重試一次
          for i in 1 2; do
            flutter build apk --release 2>&1 | tee ci-out/build.log
            [ "${PIPESTATUS[0]}" -eq 0 ] && exit 0
            sleep 20
          done
          exit 1

      - uses: actions/upload-artifact@v4
        if: steps.build.outcome == 'success'
        with:
          name: pet-overlay-apk
          path: build/app/outputs/flutter-apk/app-release.apk

      # ---- 模擬器實測 ----
      - name: Enable KVM
        if: steps.build.outcome == 'success'
        run: |
          echo 'KERNEL=="kvm", GROUP="kvm", MODE="0666", OPTIONS+="static_node=kvm"' | sudo tee /etc/udev/rules.d/99-kvm4all.rules
          sudo udevadm control --reload-rules
          sudo udevadm trigger --name-match=kvm

      - uses: actions/setup-python@v5
        if: steps.build.outcome == 'success'
        with:
          python-version: '3.12'
      - name: Install Pillow (screenshot pixel check)
        if: steps.build.outcome == 'success'
        run: python -m pip install pillow==11.3.0

      - name: Run on emulator
        id: emu
        if: steps.build.outcome == 'success'
        uses: reactivecircus/android-emulator-runner@v2
        with:
          api-level: 34
          target: google_apis
          arch: x86_64
          profile: pixel_6 # 1080x2400、420 dpi，和一般手機接近（預設 AVD 只有 320x640）
          script: bash ci/emulator_test.sh

      # ---- 把結果寫回 repo 的 ci-results 分支，讓 Claude 能直接讀 ----
      - name: Publish results to ci-results branch
        if: always()
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          {
            echo "commit: ${GITHUB_SHA}"
            echo "branch: ${GITHUB_REF_NAME}"
            echo "run: ${GITHUB_SERVER_URL}/${GITHUB_REPOSITORY}/actions/runs/${GITHUB_RUN_ID}"
            echo "analyze: ${{ steps.analyze.outcome }}"
            echo "unit: ${{ steps.unit.outcome }}"
            echo "build: ${{ steps.build.outcome }}"
            echo "emulator: ${{ steps.emu.outcome }}"
          } > ci-out/run_info.txt
          cp build/app/outputs/flutter-apk/app-release.apk ci-out/ 2>/dev/null || true
          cd ci-out
          git init -q
          git checkout -q -b ci-results
          git add -A
          git -c user.name=ci-bot -c user.email=ci-bot@users.noreply.github.com commit -qm "results ${GITHUB_SHA}"
          git push -qf "https://x-access-token:${GH_TOKEN}@github.com/${GITHUB_REPOSITORY}.git" ci-results
