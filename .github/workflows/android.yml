name: android-apk
on:
  push:
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - uses: subosito/flutter-action@v2
        with:
          channel: stable
          cache: true

      # 你的筆電不用裝 Flutter：android/ 資料夾在雲端自動產生
      - name: Generate android/ folder
        run: flutter create . --platforms=android --project-name pet_overlay --org com.joker

      - name: Patch AndroidManifest for overlay
        run: |
          python3 - <<'PY'
          p = "android/app/src/main/AndroidManifest.xml"
          s = open(p, encoding="utf-8").read()
          if "SYSTEM_ALERT_WINDOW" not in s:
              perms = (
                  '<uses-permission android:name="android.permission.SYSTEM_ALERT_WINDOW"/>\n'
                  '    <uses-permission android:name="android.permission.FOREGROUND_SERVICE"/>\n'
                  '    <uses-permission android:name="android.permission.FOREGROUND_SERVICE_SPECIAL_USE"/>\n'
                  '    <uses-permission android:name="android.permission.POST_NOTIFICATIONS"/>\n'
                  '    '
              )
              service = (
                  '    <service android:name="flutter.overlay.window.flutter_overlay_window.OverlayService"\n'
                  '            android:exported="false"\n'
                  '            android:foregroundServiceType="specialUse">\n'
                  '            <property android:name="android.app.PROPERTY_SPECIAL_USE_FGS_SUBTYPE"\n'
                  '                android:value="Floating pet companion shown over other apps"/>\n'
                  '        </service>\n'
                  '    '
              )
              s = s.replace("<application", perms + "<application", 1)
              s = s.replace("</application>", service + "</application>", 1)
              open(p, "w", encoding="utf-8").write(s)
          print(s)
          PY

      - run: flutter pub get
      - run: flutter build apk --debug

      - uses: actions/upload-artifact@v4
        with:
          name: pet-overlay-apk
          path: build/app/outputs/flutter-apk/app-debug.apk
